<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>Password Test</title></head>
<body>
<h2>Password field test</h2>
<input id="user" type="text" placeholder="username" value="alice">
<input id="pass" type="password" placeholder="password" value="S3cr3t-Do-Not-Expose">
<input id="token" type="text" placeholder="token" value="public-token-value">
<div id="log">no action</div>
<script>
document.getElementById('pass').addEventListener('input', (e) => {
  document.getElementById('log').textContent = 'pass length=' + e.target.value.length;
});
</script>
</body></html>
