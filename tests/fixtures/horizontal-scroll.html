<!DOCTYPE html><html><head><meta charset="utf-8"><title>HScroll</title>
<style>#h{width:300px;overflow-x:auto;white-space:nowrap;border:2px solid #39c}#h>div{width:2000px}</style></head>
<body><h2>Horizontal scroll</h2>
<div id="h"><div>AAAA BBBBB CCCCC DDDDD EEEEE FFFFF GGGGG HHHHH IIIII JJJJJ</div></div>
<div id="log"></div>
<script>document.getElementById('h').addEventListener('scroll',()=>{document.getElementById('log').textContent='scrollLeft='+Math.round(document.getElementById('h').scrollLeft);});</script>
</body></html>
