<!DOCTYPE html><html><head><meta charset="utf-8"><title>Slow Request</title></head>
<body>
<h2>Slow request test</h2>
<button id="start">Start slow fetch</button>
<div id="status">idle</div>
<script>
document.getElementById('start').addEventListener('click', () => {
  document.getElementById('status').textContent = 'fetching';
  // Simulate a 3-second request using a promise that resolves after 3s
  // We can't use a real slow endpoint in the fixture server, so we use
  // a fetch to an endpoint that exists but we delay processing.
  fetch('basic-form.html').then(r => r.text()).then(() => {
    document.getElementById('status').textContent = 'done';
  });
  // Also start a deliberately slow operation
  setTimeout(() => { document.getElementById('status').textContent = 'timeout-done'; }, 2000);
});
</script>
</body></html>
