name: CI
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Browser tests need a headless Chromium; install it via apt in the job.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser fonts-noto-cjk
          echo "HEADLESS_USE_BROWSER_PATH=$(which chromium-browser)" >> $GITHUB_ENV
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        env:
          # Run as root in CI; the runtime auto-enables --no-sandbox for tests.
          HEADLESS_USE_TEST_NO_SANDBOX: "1"
        run: cargo test --workspace -- --test-threads=2
