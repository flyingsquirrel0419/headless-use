name: CI
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Browser tests need a headless Chromium; install it via apt in the job.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium fonts-noto-cjk
          echo "HEADLESS_USE_BROWSER_PATH=$(which chromium)" >> $GITHUB_ENV
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: cargo test
        # Sandboxless launch is not configured here: the browser-backed tests
        # set `no_sandbox: true` themselves in tests/common/mod.rs.
        run: cargo test --workspace -- --test-threads=2
