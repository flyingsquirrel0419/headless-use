name: Bug report
description: Report a bug in headless-use
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Before submitting,
        please search existing issues to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps or JSON-RPC/MCP commands to reproduce.
      placeholder: |
        1. Run `headless-use serve --no-sandbox`
        2. Send `{"id":1,"method":"browser.open","params":{"url":"..."}}`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages and recovery hints if any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: headless-use version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 150.0.7871.114"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 x86_64"
    validations:
      required: true
